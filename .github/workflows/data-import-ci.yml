name: Geographic data importer CI

on:
  push:
    paths:
      - "data-import/**"
      - ".github/workflows/data-import-ci.yml"
  pull_request:
    paths:
      - "data-import/**"
      - ".github/workflows/data-import-ci.yml"

permissions:
  contents: read

concurrency:
  group: data-import-ci-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-import/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r data-import/requirements.txt
      - name: Compile importer
        run: python -m py_compile data-import/import_geoboundaries.py
      - name: Unit tests
        working-directory: data-import
        run: python -m unittest -v
